[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser tests (added in Commit 19)"]

[tool.coverage.run]
source = ["app", "config"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "C90", "S", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
    "N818",  # ShortCodeNotFound / ShortCodeExpired are domain names
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.ruff.lint.per-file-ignores]
"config/*" = ["RUF012", "S105"]
"tests/*" = ["S101", "S105", "S404", "S603", "SIM117"]
"scripts/*" = ["S310", "S404", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
