{% extends "base.html" %}

{% block title %}Page not found | LinkForge{% endblock %}

{% block content %}
<section class="text-center">
  <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">404</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">This link doesn't exist</h1>
  <p class="mt-4 text-slate-600">{{ message }}</p>
  <a href="{{ url_for('main.index') }}"
     class="mt-8 inline-block rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white shadow hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2">
    Back to home
  </a>
</section>
{% endblock %}
